bus:
  port: "/dev/ttyUSB0"
  baudrate: 1000000
  protocol: 2.0
  simulated: true

left_arm:
  - {joint: l_shoulder_pitch, servo_id: 1,  neural_index: 0, min_deg: -90,  max_deg: 180, home_deg: 0,   max_vel: 60}
  - {joint: l_shoulder_roll,  servo_id: 2,  neural_index: 1, min_deg: -45,  max_deg: 135, home_deg: 45,  max_vel: 60}
  - {joint: l_shoulder_yaw,   servo_id: 3,  neural_index: 2, min_deg: -90,  max_deg: 90,  home_deg: 0,   max_vel: 60}
  - {joint: l_elbow_pitch,    servo_id: 4,  neural_index: 3, min_deg: 0,    max_deg: 150, home_deg: 90,  max_vel: 80}
  - {joint: l_elbow_yaw,      servo_id: 5,  neural_index: 4, min_deg: -90,  max_deg: 90,  home_deg: 0,   max_vel: 80}
  - {joint: l_wrist_pitch,    servo_id: 6,  neural_index: 5, min_deg: -60,  max_deg: 60,  home_deg: 0,   max_vel: 100}
  - {joint: l_wrist_roll,     servo_id: 7,  neural_index: 6, min_deg: -90,  max_deg: 90,  home_deg: 0,   max_vel: 100}

right_arm:
  - {joint: r_shoulder_pitch, servo_id: 11, neural_index: 7,  min_deg: -90,  max_deg: 180, home_deg: 0,   max_vel: 60}
  - {joint: r_shoulder_roll,  servo_id: 12, neural_index: 8,  min_deg: -135, max_deg: 45,  home_deg: -45, max_vel: 60}
  - {joint: r_shoulder_yaw,   servo_id: 13, neural_index: 9,  min_deg: -90,  max_deg: 90,  home_deg: 0,   max_vel: 60}
  - {joint: r_elbow_pitch,    servo_id: 14, neural_index: 10, min_deg: 0,    max_deg: 150, home_deg: 90,  max_vel: 80}
  - {joint: r_elbow_yaw,      servo_id: 15, neural_index: 11, min_deg: -90,  max_deg: 90,  home_deg: 0,   max_vel: 80}
  - {joint: r_wrist_pitch,    servo_id: 16, neural_index: 12, min_deg: -60,  max_deg: 60,  home_deg: 0,   max_vel: 100}
  - {joint: r_wrist_roll,     servo_id: 17, neural_index: 13, min_deg: -90,  max_deg: 90,  home_deg: 0,   max_vel: 100}

stance:
  - {joint: waist_yaw,     servo_id: 21, neural_index: 0, min_deg: -120, max_deg: 120, home_deg: 0,  max_vel: 40}
  - {joint: hip_pitch,     servo_id: 22, neural_index: 1, min_deg: -30,  max_deg: 30,  home_deg: 0,  max_vel: 30}
  - {joint: base_rotation, servo_id: 23, neural_index: 2, min_deg: -180, max_deg: 180, home_deg: 0,  max_vel: 30}
  - {joint: height_adjust, servo_id: 24, neural_index: 3, min_deg: 0,    max_deg: 90,  home_deg: 45, max_vel: 20}

grip:
  - {joint: r_grip, servo_id: 31, min_torque: 0.0, max_torque: 1.5, mode: current_control}

safety:
  e_stop_gpio: 7
  watchdog_timeout_ms: 500
  safe_park_position: home
  max_acceleration: 100
  torque_limit_pct: 80
  temperature_shutdown: 70
